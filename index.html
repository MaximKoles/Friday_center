<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Календарь — Досуговый центр «Пятница»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121b24;
      --bg-card: #182330;
      --bg-cell: #1d2c3c;
      --bg-cell-empty: #15202b;
      --border: #293d52;
      --cat-lecture: #e5b83b;
      --cat-club: #9e3f35;
      --cat-other: #789242;
      --cat-lecture-text: #121b24;
      --cat-club-text: #f5eedc;
      --cat-other-text: #f5eedc;
      --text-main: #f5eedc;
      --text-muted: #8da2b5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px 10px 32px; }
    .container { width: 100%; max-width: 520px; }
    header { text-align: center; margin-bottom: 12px; }
    .brand-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(229, 184, 59, 0.12); color: var(--cat-lecture); border: 1px solid rgba(229, 184, 59, 0.28); padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; text-decoration: none; cursor: pointer; transition: background 0.2s; }
    .brand-tag:hover { background: rgba(229, 184, 59, 0.2); }
    .brand-tag:active { transform: scale(0.96); }
    .month-nav-header { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-bottom: 4px; }
    .nav-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 38px; height: 38px; border-radius: 10px; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
    .nav-btn:active { transform: scale(0.92); background: var(--border); }
    .nav-btn.disabled { opacity: 0.25; cursor: not-allowed; pointer-events: none; }
    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); text-transform: capitalize; }
    
    /* Стили панели переключения и поиска */
    .controls-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto 8px;
      width: 100%;
      height: 38px;
    }
    .view-toggle { 
      display: flex; 
      gap: 4px; 
      background: var(--bg-dark); 
      border-radius: 10px; 
      padding: 3px; 
      border: 1px solid var(--border); 
    }
    .view-btn { background: transparent; border: none; color: var(--text-muted); padding: 4px 14px; border-radius: 7px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .view-btn.active { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); }
    .view-btn:active { transform: scale(0.95); }

    .search-open-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .search-open-btn:active {
      transform: translateY(-50%) scale(0.92);
      color: var(--cat-lecture);
    }
    .search-bar-container {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transform: scaleX(0.92);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }
    .search-bar-container.active {
      opacity: 1;
      pointer-events: auto;
      transform: scaleX(1);
    }
    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.85rem;
      font-family: inherit;
    }
    .search-input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }
    .search-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 1;
    }
    .search-close-btn:active {
      color: var(--cat-lecture);
    }

    .legend-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 14px; padding: 6px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend-dot.lecture { background-color: var(--cat-lecture); }
    .legend-dot.club { background-color: var(--cat-club); }
    .legend-dot.other { background-color: var(--cat-other); }
    .calendar-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 10px 8px 12px; }
    .weekdays-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; text-align: center; }
    .weekday { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); padding: 4px 0; text-transform: uppercase; }
    .weekday.weekend { color: #e57368; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-cell { background-color: var(--bg-cell); border: 1px solid var(--border); border-radius: 8px; min-height: 62px; padding: 4px 2px 3px; display: flex; flex-direction: column; position: relative; }
    .day-cell.other-month { background-color: var(--bg-cell-empty); border-color: rgba(41, 61, 82, 0.35); opacity: 0.25; }
    .day-header { display: flex; justify-content: flex-start; padding: 0 3px 2px; }
    .day-num { font-size: 0.8rem; font-weight: 700; color: var(--text-main); line-height: 1; }
    .day-cell.weekend .day-num { color: #e57368; }
    .events-list { display: flex; flex-direction: column; gap: 3px; flex-grow: 1; }
    .time-btn { display: block; border: none; cursor: pointer; font-size: 0.68rem; font-weight: 800; padding: 3px 1px; border-radius: 5px; text-align: center; line-height: 1.15; letter-spacing: -0.02em; transition: transform 0.1s ease, filter 0.1s ease; width: 100%; }
    .time-btn.type-lecture { background-color: var(--cat-lecture); color: var(--cat-lecture-text); }
    .time-btn.type-club { background-color: var(--cat-club); color: var(--cat-club-text); }
    .time-btn.type-other { background-color: var(--cat-other); color: var(--cat-other-text); }
    .time-btn:active { transform: scale(0.93); filter: brightness(0.9); }

    /* Список */
    .list-view { display: none; flex-direction: column; gap: 12px; }
    .list-view.active { display: flex; }
    .calendar-view { display: block; }
    .calendar-view.hidden { display: none; }
    .list-day-group { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
    .list-day-group:last-child { margin-bottom: 0; }
    .list-day-header { background: var(--bg-dark); padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .list-day-number { font-size: 1.5rem; font-weight: 800; color: var(--cat-lecture); line-height: 1; min-width: 48px; }
    .list-day-info { display: flex; flex-direction: column; gap: 1px; margin-left: 10px; }
    .list-day-month { font-size: 0.9rem; color: var(--text-muted); }
    .list-day-weekday { font-size: 0.8rem; font-weight: 600; color: var(--text-main); }
    .list-day-divider { flex: 1; height: 1px; background: var(--border); opacity: 0.3; }
    .list-event-item { padding: 10px 14px; border-bottom: 1px solid rgba(41, 61, 82, 0.2); display: flex; align-items: flex-start; gap: 10px; }
    .list-event-item:last-child { border-bottom: none; }
    .list-event-time { font-weight: 800; font-size: 0.7rem; min-width: 40px; color: var(--text-muted); padding-top: 1px; }
    .list-event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .list-event-dot.type-lecture { background: var(--cat-lecture); }
    .list-event-dot.type-club { background: var(--cat-club); }
    .list-event-dot.type-other { background: var(--cat-other); }
    .list-event-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .list-event-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); line-height: 1.3; }
    .list-event-title a { color: var(--text-main); text-decoration: underline; text-decoration-color: rgba(245, 238, 220, 0.3); }
    .list-event-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    .list-event-booking { color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; background: rgba(141, 162, 181, 0.08); border: 1px solid rgba(141, 162, 181, 0.2); color: var(--text-muted) !important; font-size: 0.7rem; font-weight: 500; padding: 2px 8px; border-radius: 4px; text-decoration: none !important; transition: all 0.15s ease; margin-top: 4px; margin-bottom: 4px; }
    .list-event-booking a { color: var(--cat-lecture); text-decoration: none; font-weight: 600; }
    .list-today-badge { background: var(--cat-lecture); color: var(--cat-lecture-text); font-size: 0.55rem; font-weight: 700; padding: 1px 8px; border-radius: 4px; text-transform: uppercase; margin-left: 4px; }
    .list-empty { padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

    .footer-bar { margin-top: 14px; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; text-align: center; font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
    .footer-bar a { color: var(--cat-lecture); font-weight: 700; text-decoration: none; }
    .creator-credits { margin-top: 30px; text-align: center; font-size: 0.75rem; color: var(--text-dim, #5c7287); }
    .creator-credits a { color: var(--text-muted, #8da2b5); text-decoration: none; font-weight: 600; transition: color 0.15s ease; }
    .creator-credits a:hover, .creator-credits a:active { color: var(--cat-lecture, #e5b83b); text-decoration: underline; }
    .gcal-btn { display: inline-flex; align-items: center; gap: 5px; background: rgba(141, 162, 181, 0.08); border: 1px solid rgba(141, 162, 181, 0.2); color: var(--text-muted) !important; font-size: 0.7rem; font-weight: 500; padding: 2px 8px; border-radius: 4px; text-decoration: none !important; transition: all 0.15s ease; }
    .gcal-btn:active { background: rgba(141, 162, 181, 0.18); color: var(--text-main) !important; transform: scale(0.97); }
    .day-cell.today { border: 1.5px solid var(--cat-lecture); background: rgba(229, 184, 59, 0.08); box-shadow: 0 0 10px rgba(229, 184, 59, 0.15); }
    .day-cell.today .day-num { color: var(--cat-lecture); }

    /* Модальное окно (только для календаря) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 16, 22, 0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; visibility: hidden; transition: opacity 0.18s ease, visibility 0.18s ease; z-index: 1000; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); overflow: hidden; animation: popModal 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.25); }
    @keyframes popModal { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header { padding: 14px 16px; background: #111a24; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
    .modal-title span { color: var(--cat-lecture); }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px 6px; border-radius: 6px; }
    .close-btn:active { color: var(--cat-lecture); }
    .modal-body { padding: 14px; max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .event-card { background: #111b26; border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .event-card.type-lecture { border-left: 3px solid var(--cat-lecture); }
    .event-card.type-club { border-left: 3px solid var(--cat-club); }
    .event-card.type-other { border-left: 3px solid var(--cat-other); }
    .event-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .event-time-badge { font-weight: 800; font-size: 0.75rem; padding: 2px 7px; border-radius: 4px; letter-spacing: -0.01em; }
    .event-card.type-lecture .event-time-badge { background: var(--cat-lecture); color: var(--cat-lecture-text); }
    .event-card.type-club .event-time-badge { background: var(--cat-club); color: var(--cat-club-text); }
    .event-card.type-other .event-time-badge { background: var(--cat-other); color: var(--cat-other-text); }
    .event-cost { font-weight: 700; font-size: 0.85rem; color: var(--cat-lecture); }
    .event-name { font-size: 0.9rem; font-weight: 600; line-height: 1.35; color: var(--text-main); }
    .event-name a { color: var(--text-main); text-decoration: underline; text-decoration-color: rgba(245, 238, 220, 0.4); }
    .event-action { margin-top: 2px; font-size: 0.8rem; color: var(--text-muted); }
    .event-action a { color: var(--cat-lecture); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; background: rgba(141, 162, 181, 0.08); border: 1px solid rgba(141, 162, 181, 0.2); font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; transition: all 0.15s ease; margin-top: 4px; margin-bottom: 4px; margin-right: 3px;}
  </style>
</head>
<body>

  <div class="container">

      <div class="modal-body" id="modalContent"></div>

            27: [{ time: "14:00", title: "Лекция от проектов «Популярная история» & «Свидание с Краснодаром». «За партой в Российской империи: уроки Екатеринодара»", price: "700 ₽", type: "lecture", links: ["https://t.me/popular_history_krd", "https://t.me/krasnodarwithlove"] }],
            28: [{ time: "19:00", title: "Квартирник", price: "600 ₽", type: "other" }],

          }

      ];

      // ==================== КОНСТАНТЫ ====================
      const WEEKDAYS_SHORT = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
      const MONTH_GENITIVE = { "Август": "августа", "Сентябрь": "сентября" };

      // ==================== DOM-кеш ====================
      const el = {
        monthTitle: document.getElementById('monthTitle'),
        calendarGrid: document.getElementById('calendarGrid'),
        listContent: document.getElementById('listContent'),
        modalOverlay: document.getElementById('modalOverlay'),
        modalTitle: document.getElementById('modalTitle'),
        modalContent: document.getElementById('modalContent'),
        viewCalendar: document.getElementById('viewCalendar'),
        viewList: document.getElementById('viewList'),
        calendarView: document.getElementById('calendarView'),
        listView: document.getElementById('listView'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        searchBarContainer: document.getElementById('searchBarContainer'),
        searchInput: document.getElementById('searchInput')
      };

      // ==================== СОСТОЯНИЕ ====================
      let currentMonthIndex = 1;
      let currentView = 'calendar';
      let searchQuery = '';

      // ==================== УТИЛИТЫ ====================
      function formatDate(monthData, day) {
        const date = new Date(monthData.year, monthData.monthIndex, day);
        const dayName = WEEKDAYS_SHORT[date.getDay()];
        const monthGen = MONTH_GENITIVE[monthData.name] || monthData.name.toLowerCase();
        return `${day} ${monthGen}, ${dayName}`;
      }

      function getFirstDayOffset(monthData) {
        const date = new Date(monthData.year, monthData.monthIndex, 1);
        let day = date.getDay();
        return (day === 0) ? 6 : day - 1;
      }

      function getDayOfWeek(monthData, dayNumber) {
        const date = new Date(monthData.year, monthData.monthIndex, dayNumber);
        return date.getDay();
      }

      function getBookingInfo(ev) {
        if (ev.booking) {
          const clean = ev.booking.replace('@', '');
          return { text: `Запись: ${ev.booking}`, url: `https://t.me/${clean}` };
        }
        return { text: 'ЗАПИСАТЬСЯ', url: 'https://t.me/lena_timinova' };
      }

      function getEventTitleHTML(ev) {
        if (ev.link) {
          return `<a href="${ev.link}" target="_blank">${ev.title}</a>`;
        }
        if (ev.links && ev.links.length) {
          let title = ev.title;
          const links = ev.links.map(l => `<a href="${l}" target="_blank">${l.replace('https://t.me/', '@')}</a>`);
          title = title.replace('«Популярная история»', `«Популярная история» (${links[0]})`)
                       .replace('«Свидание с Краснодаром»', `«Свидание с Краснодаром» (${links[1]})`);
          return title;
        }
        return ev.title;
      }

      function getGoogleCalendarLink(monthData, day, ev) {
        const monthStr = String(monthData.monthIndex + 1).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const [startHour, startMin] = ev.time.split(':').map(Number);
        const startIso = `${monthData.year}${monthStr}${dayStr}T${String(startHour).padStart(2,'0')}${String(startMin).padStart(2,'0')}00`;
        const endHour = startHour + 2;
        const endDay = endHour >= 24 ? day + 1 : day;
        const endDayStr = String(endDay).padStart(2, '0');
        const endHourStr = String(endHour % 24).padStart(2, '0');
        const endIso = `${monthData.year}${monthStr}${endDayStr}T${endHourStr}${String(startMin).padStart(2,'0')}00`;
        const title = encodeURIComponent(ev.title);
        const details = encodeURIComponent(`Стоимость: ${ev.price}\n\nДосуговый центр «Пятница»`);
        const location = encodeURIComponent('Досуговый центр Пятница, Краснодар');
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startIso}/${endIso}&details=${details}&location=${location}`;
      }

      function matchesSearch(ev) {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (ev.title && ev.title.toLowerCase().includes(q)) || 
               (ev.price && ev.price.toLowerCase().includes(q)) ||
               (ev.booking && ev.booking.toLowerCase().includes(q));
      }

      // ==================== РЕНДЕРИНГ КАЛЕНДАРЯ ====================
      function renderCalendar() {
        const monthData = monthsData[currentMonthIndex];
        el.monthTitle.textContent = monthData.name;

        el.prevBtn.classList.toggle('disabled', currentMonthIndex === 0);
        el.nextBtn.classList.toggle('disabled', currentMonthIndex === monthsData.length - 1);

        el.calendarGrid.innerHTML = '';

        const firstDayOffset = getFirstDayOffset(monthData);
        for (let i = 0; i < firstDayOffset; i++) {
          const empty = document.createElement('div');
          empty.className = 'day-cell other-month';
          el.calendarGrid.appendChild(empty);
        }

        const today = new Date();
        const todayMonth = today.getMonth();
        const todayDate = today.getDate();
        const isCurrentMonth = (todayMonth === monthData.monthIndex && today.getFullYear() === monthData.year);

        for (let day = 1; day <= monthData.totalDays; day++) {
          const dayOfWeek = getDayOfWeek(monthData, day);
          const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
          const isToday = isCurrentMonth && todayDate === day;

          const cell = document.createElement('div');
          cell.className = `day-cell ${isWeekend ? 'weekend' : ''} ${isToday ? 'today' : ''}`;

          const header = document.createElement('div');
          header.className = 'day-header';
          const numSpan = document.createElement('span');
          numSpan.className = 'day-num';
          numSpan.textContent = day;
          header.appendChild(numSpan);
          cell.appendChild(header);

          const rawEvents = monthData.events[day] || [];
          const events = rawEvents.filter(matchesSearch);

          if (events.length) {
            const list = document.createElement('div');
            list.className = 'events-list';
            events.forEach(ev => {
              const btn = document.createElement('button');
              btn.className = `time-btn type-${ev.type}`;
              btn.textContent = ev.time;
              btn.dataset.day = day;
              btn.dataset.monthIndex = currentMonthIndex;
              list.appendChild(btn);
            });
            cell.appendChild(list);
          }

          el.calendarGrid.appendChild(cell);
        }

        const totalCells = firstDayOffset + monthData.totalDays;
        const trailing = (7 - (totalCells % 7)) % 7;
        for (let i = 0; i < trailing; i++) {
          const empty = document.createElement('div');
          empty.className = 'day-cell other-month';
          el.calendarGrid.appendChild(empty);
        }

        if (currentView === 'list') renderList();
      }

      // ==================== РЕНДЕРИНГ СПИСКА ====================
      function renderList() {
        const monthData = monthsData[currentMonthIndex];
        const allEvents = [];
        for (let day = 1; day <= monthData.totalDays; day++) {
          const dayEvents = monthData.events[day];
          if (dayEvents) {
            dayEvents.forEach(ev => {
              if (matchesSearch(ev)) {
                allEvents.push({ day, ...ev });
              }
            });
          }
        }

        if (allEvents.length === 0) {
          const emptyText = searchQuery 
            ? 'По вашему запросу ничего не найдено' 
            : 'В этом месяце пока нет событий';
          el.listContent.innerHTML = `<div class="list-empty">${emptyText}</div>`;
          return;
        }

        const groups = new Map();
        allEvents.forEach(ev => {
          if (!groups.has(ev.day)) groups.set(ev.day, []);
          groups.get(ev.day).push(ev);
        });
        const sortedDays = Array.from(groups.keys()).sort((a, b) => a - b);

        const today = new Date();
        const isCurrentMonth = (today.getMonth() === monthData.monthIndex && today.getFullYear() === monthData.year);
        const todayDate = today.getDate();

        let html = '';
        sortedDays.forEach(day => {
          const events = groups.get(day).sort((a, b) => a.time.localeCompare(b.time));
          const dateObj = new Date(monthData.year, monthData.monthIndex, day);
          const dayNameShort = WEEKDAYS_SHORT[dateObj.getDay()];
          const isToday = isCurrentMonth && todayDate === day;
          const monthGen = MONTH_GENITIVE[monthData.name] || monthData.name.toLowerCase();

          html += `
            <div class="list-day-group">
              <div class="list-day-header">
                <span class="list-day-number">${day}</span>
                <div class="list-day-info">
                  <span class="list-day-month">${monthGen}, ${dayNameShort}</span>
                  ${isToday ? '<span class="list-today-badge">Сегодня</span>' : ''}
                </div>
              </div>
          `;

          events.forEach(ev => {
            const typeClass = ev.type || 'other';
            const priceText = ev.price || 'Уточняйте';
            const booking = getBookingInfo(ev);
            const titleHTML = getEventTitleHTML(ev);
            const gcalLink = getGoogleCalendarLink(monthData, day, ev);

            html += `
              <div class="list-event-item">
                <span class="list-event-time">${ev.time}</span>
                <span class="list-event-dot type-${typeClass}"></span>
                <div class="list-event-info">
                  <div class="list-event-title">${titleHTML}</div>
                  <div class="list-event-meta">
                    <span class="list-event-price">${priceText}</span>
                    <span class="list-event-booking"><a href="${booking.url}" target="_blank">${booking.text}</a></span>
                    <a href="${gcalLink}" target="_blank" class="gcal-btn">📅</a>
                  </div>
                </div>
              </div>
            `;
          });

          html += `</div>`;
        });

        el.listContent.innerHTML = html;
      }

      // ==================== УПРАВЛЕНИЕ ПОИСКОМ ====================
      window.openSearch = function() {
        el.searchBarContainer.classList.add('active');
        el.searchInput.focus();
      };

      window.closeSearch = function() {
        el.searchBarContainer.classList.remove('active');
        el.searchInput.value = '';
        searchQuery = '';
        renderCalendar();
        if (currentView === 'list') renderList();
      };

      el.searchInput.addEventListener('input', function(e) {
        searchQuery = e.target.value.trim();
        renderCalendar();
        if (currentView === 'list') renderList();
      });

      // ==================== ПЕРЕКЛЮЧЕНИЕ МЕСЯЦЕВ И ВИДОВ ====================
      window.switchMonth = function(direction) {
        const newIndex = currentMonthIndex + direction;
        if (newIndex >= 0 && newIndex < monthsData.length) {
          currentMonthIndex = newIndex;
          renderCalendar();
          if (currentView === 'list') renderList();
        }
      };

      window.switchView = function(view) {
        currentView = view;
        if (view === 'calendar') {
          el.calendarView.classList.remove('hidden');
          el.calendarView.style.display = 'block';
          el.listView.classList.remove('active');
          el.listView.style.display = 'none';
          el.viewCalendar.classList.add('active');
          el.viewList.classList.remove('active');
          renderCalendar();
        } else {
          el.calendarView.classList.add('hidden');
          el.calendarView.style.display = 'none';
          el.listView.classList.add('active');
          el.listView.style.display = 'flex';
          el.viewList.classList.add('active');
          el.viewCalendar.classList.remove('active');
          renderList();
        }
      };

      // ==================== МОДАЛЬНОЕ ОКНО ====================
      function openModal(day) {
        const monthData = monthsData[currentMonthIndex];
        const rawEvents = monthData.events[day];
        if (!rawEvents) return;

        const events = rawEvents.filter(matchesSearch);
        if (!events.length) return;

        const dateStr = formatDate(monthData, day);
        el.modalTitle.innerHTML = `<span>✦</span> ${dateStr}`;

        let contentHTML = '';
        events.forEach(ev => {
          const booking = getBookingInfo(ev);
          const titleHTML = getEventTitleHTML(ev);
          const gcalLink = getGoogleCalendarLink(monthData, day, ev);

          contentHTML += `
            <div class="event-card type-${ev.type}">
              <div class="event-top">
                <span class="event-time-badge">${ev.time}</span>
                <span class="event-cost">${ev.price}</span>
              </div>
              <div class="event-name">${titleHTML}</div>
              <div class="event-action"><a href="${booking.url}" target="_blank">${booking.text.replace('', '')}</a>
                <a href="${gcalLink}" target="_blank" class="gcal-btn">📅 Добавить в календарь</a>
              </div>
            </div>
          `;
        });

        el.modalContent.innerHTML = contentHTML;
        el.modalOverlay.classList.add('active');
      }

      // ==================== ОБРАБОТЧИКИ СОБЫТИЙ ====================
      el.calendarGrid.addEventListener('click', function(e) {
        const btn = e.target.closest('.time-btn');
        if (!btn) return;
        const day = parseInt(btn.dataset.day, 10);
        if (!isNaN(day)) openModal(day);
      });

      window.closeModal = function(e) {
        if (e.target === el.modalOverlay) closeModalDirect();
      };
      window.closeModalDirect = function() {
        el.modalOverlay.classList.remove('active');
      };
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeModalDirect();
          if (el.searchBarContainer.classList.contains('active')) {
            closeSearch();
          }
        }
      });

      // ==================== ИНИЦИАЛИЗАЦИЯ ====================
      renderCalendar();
    })();
  </script>
