<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Календарь — Досуговый центр «Пятница»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121b24;
      --bg-card: #182330;
      --bg-cell: #1d2c3c;
      --bg-cell-empty: #15202b;
      --border: #293d52;
      --cat-lecture: #e5b83b;
      --cat-club: #9e3f35;
      --cat-other: #789242;
      --cat-lecture-text: #121b24;
      --cat-club-text: #f5eedc;
      --cat-other-text: #f5eedc;
      --text-main: #f5eedc;
      --text-muted: #8da2b5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px 10px 32px; }
    .container { width: 100%; max-width: 520px; }
    header { text-align: center; margin-bottom: 12px; }
    .brand-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(229, 184, 59, 0.12); color: var(--cat-lecture); padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; text-decoration: none; cursor: pointer; transition: background 0.2s; }
    .brand-tag:hover { background: rgba(229, 184, 59, 0.2); }
    .brand-tag:active { transform: scale(0.96); }
    .month-nav-header { display: flex; align-items: center; justify-content: space-between; padding: 0 0px; margin-bottom: 4px; }
    .nav-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 34px; height: 34px; border-radius: 10px; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease; }
    .nav-btn:active { transform: scale(0.92); background: var(--border); }
    .nav-btn:disabled,.nav-btn[disabled] {  opacity: 0.2;  cursor: not-allowed;  pointer-events: none; }
    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); text-transform: capitalize; }
    
    .controls-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto 8px;
      width: 100%;
      height: 38px;
    }
    .view-toggle { 
      display: flex; 
      gap: 4px; 
      background: var(--bg-dark); 
      border-radius: 10px; 
      padding: 3px; 
      border: 1px solid var(--border); 
    }
    .view-btn { background: transparent; border: none; color: var(--text-muted); padding: 4px 14px; border-radius: 7px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .view-btn.active { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); }
    .view-btn:active { transform: scale(0.95); }

    .search-open-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .search-open-btn:active {
      transform: translateY(-50%) scale(0.92);
      color: var(--cat-lecture);
    }
    .search-bar-container {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transform: scaleX(0.92);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }
    .search-bar-container.active {
      opacity: 1;
      pointer-events: auto;
      transform: scaleX(1);
    }
    .search-icon { color: var(--text-muted); flex-shrink: 0; display: flex; align-items: center; }
    .search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 0.85rem; font-family: inherit; }
    .search-input::placeholder { color: var(--text-muted); opacity: 0.7; }
    .search-close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; line-height: 1; }
    .search-close-btn:active { color: var(--cat-lecture); }

    .legend-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 14px; padding: 6px 12px; border-radius: 20px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    .legend-dot.lecture { background-color: var(--cat-lecture); }
    .legend-dot.club { background-color: var(--cat-club); }
    .legend-dot.other { background-color: var(--cat-other); }
    
    .calendar-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 10px 8px 12px; min-height: 280px; position: relative; }
    
    .loading-spinner {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.85rem;
      z-index: 20;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(229, 184, 59, 0.2);
      border-top-color: var(--cat-lecture);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .weekdays-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; text-align: center; }
    .weekday { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); padding: 4px 0; text-transform: uppercase; }
    .weekday.weekend { color: #e57368; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-cell { background-color: var(--bg-cell); border: 1px solid var(--border); border-radius: 8px; min-height: 62px; padding: 4px 2px 3px; display: flex; flex-direction: column; position: relative; }
    .day-cell.other-month { background-color: var(--bg-cell-empty); border-color: rgba(41, 61, 82, 0.35); opacity: 0.25; }
    .day-header { display: flex; justify-content: flex-start; padding: 0 3px 2px; }
    .day-num { font-size: 0.8rem; font-weight: 700; color: var(--text-main); line-height: 1; }
    .day-cell.weekend .day-num { color: #e57368; }
    .events-list { display: flex; flex-direction: column; gap: 3px; flex-grow: 1; }
    .time-btn { display: block; border: none; cursor: pointer; font-size: 0.68rem; font-weight: 800; padding: 3px 1px; border-radius: 5px; text-align: center; line-height: 1.15; letter-spacing: -0.02em; transition: transform 0.1s ease, filter 0.1s ease; width: 100%; }
    .time-btn.type-lecture { background-color: var(--cat-lecture); color: var(--cat-lecture-text); }
    .time-btn.type-club { background-color: var(--cat-club); color: var(--cat-club-text); }
    .time-btn.type-other { background-color: var(--cat-other); color: var(--cat-other-text); }
    .time-btn:active { transform: scale(0.93); filter: brightness(0.9); }

    /* Список */
    .list-view { display: none; flex-direction: column; gap: 12px; }
    .list-view.active { display: flex; }
    .calendar-view { display: block; }
    .calendar-view.hidden { display: none; }
    .list-day-group { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
    .list-day-group:last-child { margin-bottom: 0; }
    .list-day-header { background: var(--bg-dark); padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .list-day-number { font-size: 1.5rem; font-weight: 800; color: var(--cat-lecture); line-height: 1; min-width: 48px; }
    .list-day-info { display: flex; flex-direction: column; gap: 1px; margin-left: 10px; }
    .list-day-month { font-size: 0.9rem; color: var(--text-muted); }
    .list-day-weekday { font-size: 0.8rem; font-weight: 600; color: var(--text-main); }
    .list-day-divider { flex: 1; height: 1px; background: var(--border); opacity: 0.3; }
    .list-event-item { padding: 10px 14px; border-bottom: 1px solid rgba(41, 61, 82, 0.2); display: flex; align-items: flex-start; gap: 10px; }
    .list-event-item:last-child { border-bottom: none; }
    .list-event-time { font-weight: 800; font-size: 0.7rem; min-width: 40px; color: var(--text-muted); padding-top: 1px; }
    .list-event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .list-event-dot.type-lecture { background: var(--cat-lecture); }
    .list-event-dot.type-club { background: var(--cat-club); }
    .list-event-dot.type-other { background: var(--cat-other); }
    .list-event-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .list-event-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); line-height: 1.3; }
    .list-event-title a { color: var(--text-main); text-decoration: underline; text-decoration-color: rgba(245, 238, 220, 0.3); }
    .list-event-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    .list-event-booking { color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; background: rgba(141, 162, 181, 0.08); border: 1px solid rgba(141, 162, 181, 0.2); color: var(--text-muted) !important; font-size: 0.7rem; font-weight: 500; padding: 2px 8px; border-radius: 4px; text-decoration: none !important; transition: all 0.15s ease; margin-top: 4px; margin-bottom: 4px; }
    .list-event-booking a { color: var(--cat-lecture); text-decoration: none; font-weight: 600; }
    .list-today-badge { background: var(--cat-lecture); color: var(--cat-lecture-text); font-size: 0.55rem; font-weight: 700; padding: 1px 8px; border-radius: 4px; text-transform: uppercase; margin-left: 4px; }
    .list-empty { padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

    .footer-bar { margin-top: 14px; padding: 12px 14px; border-radius: 12px; text-align: center; font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; }
    .footer-bar a { color: var(--cat-lecture); font-weight: 700; text-decoration: none; }
    .creator-credits { margin-top: 30px; text-align: center; font-size: 0.75rem; color: var(--text-dim, #5c7287); }
    .creator-credits a { color: var(--text-muted, #8da2b5); text-decoration: none; font-weight: 600; transition: color 0.15s ease; }
    .creator-credits a:hover, .creator-credits a:active { color: var(--cat-lecture, #e5b83b); text-decoration: underline; }
    .gcal-btn { display: inline-flex; align-items: center; gap: 5px; background: rgba(141, 162, 181, 0.08); border: 1px solid rgba(141, 162, 181, 0.2); color: var(--text-muted) !important; font-size: 0.7rem; font-weight: 500; padding: 2px 8px; border-radius: 4px; text-decoration: none !important; transition: all 0.15s ease; }
    .gcal-btn:active { background: rgba(141, 162, 181, 0.18); color: var(--text-main) !important; transform: scale(0.97); }
    .day-cell.today { border: 1.5px solid var(--cat-lecture); background: rgba(229, 184, 59, 0.08); box-shadow: 0 0 10px rgba(229, 184, 59, 0.15); }
    .day-cell.today .day-num { color: var(--cat-lecture); }

    /* Модальное окно */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 16, 22, 0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; visibility: hidden; transition: opacity 0.18s ease, visibility 0.18s ease; z-index: 1000; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); overflow: hidden; animation: popModal 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.25); }
    @keyframes popModal { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header { padding: 14px 16px; background: #111a24; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
    .modal-title span { color: var(--cat-lecture); }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px 6px; border-radius: 6px; }
    .close-btn:active { color: var(--cat-lecture); }
    .modal-body { padding: 14px; max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .event-card { background: #111b26; border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .event-card.type-lecture { border-left: 3px solid var(--cat-lecture); }
    .event-card.type-club { border-left: 3px solid var(--cat-club); }
    .event-card.type-other { border-left: 3px solid var(--cat-other); }
    .event-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .event-time-badge { font-weight: 800; font-size: 0.75rem; padding: 2px 7px; border-radius: 4px; letter-spacing: -0.01em; }
    .event-card.type-lecture .event-time-badge { background: var(--cat-lecture); color: var(--cat-lecture-text); }
    .event-card.type-club .event-time-badge { background: var(--cat-club); color: var(--cat-club-text); }
    .event-card.type-other .event-time-badge { background: var(--cat-other); color: var(--cat-other-text); }
    .event-cost { font-weight: 700; font-size: 0.85rem; color: var(--cat-lecture); }
    .event-name { font-size: 0.9rem; font-weight: 600; line-height: 1.35; color: var(--text-main); }
    .event-name a { color: var(--text-main); text-decoration: underline; text-decoration-color: rgba(245, 238, 220, 0.4); }
    .event-action { margin-top: 2px; font-size: 0.8rem; color: var(--text-muted); }
    .event-action a { color: var(--cat-lecture); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; background: rgba(141, 162, 181, 0.08); border: 1px solid rgba(141, 162, 181, 0.2); font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; transition: all 0.15s ease; margin-top: 4px; margin-bottom: 4px; margin-right: 3px;}
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="https://t.me/friday_center" target="_blank" class="brand-tag">Досуговый центр «Пятница»</a>
      <div class="month-nav-header">
        <button class="nav-btn" id="prevBtn" onclick="switchMonth(-1)">‹</button>
        <h1 id="monthTitle">...</h1>
        <button class="nav-btn" id="nextBtn" onclick="switchMonth(1)">›</button>
      </div>

      <div class="controls-wrapper">
        <div class="view-toggle">
          <button class="view-btn active" id="viewCalendar" onclick="switchView('calendar')">Календарь</button>
          <button class="view-btn" id="viewList" onclick="switchView('list')">Список</button>
        </div>
        
        <button class="search-open-btn" id="searchOpenBtn" onclick="openSearch()" title="Поиск">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>

        <div class="search-bar-container" id="searchBarContainer">
          <div class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <input type="text" id="searchInput" class="search-input" placeholder="Поиск мероприятий..." autocomplete="off">
          <button class="search-close-btn" onclick="closeSearch()">&times;</button>
        </div>
      </div>
    </header>

    <div class="legend-bar">
      <div class="legend-item"><span class="legend-dot lecture"></span> Лекции и МК</div>
      <div class="legend-item"><span class="legend-dot club"></span> Клубы и встречи</div>
      <div class="legend-item"><span class="legend-dot other"></span> Игры и события</div>
    </div>

    <div class="calendar-card">
      <div class="loading-spinner" id="loadingState">
        <div class="spinner"></div>
        <span>Загружаем расписание...</span>
      </div>

      <div class="calendar-view" id="calendarView">
        <div class="weekdays-grid">
          <div class="weekday">Пн</div><div class="weekday">Вт</div><div class="weekday">Ср</div>
          <div class="weekday">Чт</div><div class="weekday">Пт</div>
          <div class="weekday weekend">Сб</div><div class="weekday weekend">Вс</div>
        </div>
        <div class="days-grid" id="calendarGrid"></div>
      </div>

      <div class="list-view" id="listView">
        <div id="listContent"></div>
      </div>
    </div>

    <div class="footer-bar">
      Запись через <a href="https://t.me/lena_timinova" target="_blank">@lena_timinova</a> или резидента события
    </div>
    <div class="creator-credits">
      Сделал <a href="https://t.me/maxim_koles" target="_blank">@maxim_koles</a> с ИИ
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"><span>✦</span> Дата</div>
        <button class="close-btn" onclick="closeModalDirect()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ==================== ССЫЛКА НА GOOGLE ТАБЛИЦУ ====================
      const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR4YgaFY5i_Ie8NZ9WW7gBAz_1CT6FQEybQDbA8fgs_Zr09b8ulPI1T3BVKpf_LiPWgTQ3CykxRNZgv/pub?output=csv";

      // ==================== КОНСТАНТЫ ====================
      const WEEKDAYS_SHORT = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
      const MONTH_NAMES = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      const MONTH_GENITIVE = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

      // ==================== DOM-КЕШ ====================
      const el = {
        monthTitle: document.getElementById('monthTitle'),
        calendarGrid: document.getElementById('calendarGrid'),
        listContent: document.getElementById('listContent'),
        modalOverlay: document.getElementById('modalOverlay'),
        modalTitle: document.getElementById('modalTitle'),
        modalContent: document.getElementById('modalContent'),
        viewCalendar: document.getElementById('viewCalendar'),
        viewList: document.getElementById('viewList'),
        calendarView: document.getElementById('calendarView'),
        listView: document.getElementById('listView'),
        searchBarContainer: document.getElementById('searchBarContainer'),
        searchInput: document.getElementById('searchInput'),
        loadingState: document.getElementById('loadingState'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn')
      };

      // ==================== СОСТОЯНИЕ ====================
      let monthsData = []; // Только месяцы, в которых ЕСТЬ события
      let currentMonthIndex = 0;
      let currentView = 'calendar';
      let searchQuery = '';

      // ==================== ПАРСИНГ CSV ====================
      function parseCSV(text) {
        const rows = [];
        let row = [];
        let inQuotes = false;
        let token = '';

        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const firstLine = text.split('\n')[0] || '';
        const delimiter = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';

        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          const next = text[i + 1];

          if (c === '"') {
            if (inQuotes && next === '"') {
              token += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (c === delimiter && !inQuotes) {
            row.push(token.trim());
            token = '';
          } else if (c === '\n' && !inQuotes) {
            row.push(token.trim());
            if (row.length > 1 || row[0] !== '') rows.push(row);
            row = [];
            token = '';
          } else {
            token += c;
          }
        }
        if (token || row.length) {
          row.push(token.trim());
          if (row.length > 1 || row[0] !== '') rows.push(row);
        }

        if (rows.length < 2) return [];

        const headerAliases = {
          'date': 'date', 'дата': 'date', 'день': 'date',
          'time': 'time', 'время': 'time',
          'title': 'title', 'название': 'title', 'событие': 'title', 'мероприятие': 'title',
          'price': 'price', 'цена': 'price', 'стоимость': 'price',
          'type': 'type', 'тип': 'type', 'категория': 'type',
          'booking': 'booking', 'запись': 'booking', 'контакт': 'booking',
          'link': 'link', 'ссылка': 'link'
        };

        const headers = rows[0].map(h => {
          const clean = h.toLowerCase().trim();
          return headerAliases[clean] || clean;
        });

        return rows.slice(1).map(r => {
          const item = {};
          headers.forEach((h, idx) => {
            item[h] = r[idx] !== undefined ? r[idx] : '';
          });
          return item;
        });
      }

      function parseDateString(str) {
        if (!str) return null;
        str = str.trim();
        let year, month, day;

        if (str.includes('-')) {
          const p = str.split('-').map(Number);
          year = p[0]; month = p[1] - 1; day = p[2];
        } else if (str.includes('.')) {
          const p = str.split('.').map(Number);
          day = p[0]; month = p[1] - 1; year = p[2];
        } else if (str.includes('/')) {
          const p = str.split('/').map(Number);
          day = p[0]; month = p[1] - 1; year = p[2];
        } else {
          return null;
        }

        if (year < 100) year += 2000;
        if (isNaN(year) || isNaN(month) || isNaN(day) || month < 0 || month > 11 || day < 1 || day > 31) {
          return null;
        }
        return { year, month, day };
      }

      function processParsedData(parsedRows) {
        const map = new Map();

        parsedRows.forEach(row => {
          if (!row.date || !row.title) return;
          const parsed = parseDateString(row.date);
          if (!parsed) return;

          const { year, month, day } = parsed;
          const monthKey = `${year}-${String(month).padStart(2, '0')}`;

          if (!map.has(monthKey)) {
            const totalDays = new Date(year, month + 1, 0).getDate();
            map.set(monthKey, {
              name: MONTH_NAMES[month],
              year: year,
              monthIndex: month,
              totalDays: totalDays,
              events: {}
            });
          }

          const mObj = map.get(monthKey);
          if (!mObj.events[day]) mObj.events[day] = [];

          let type = (row.type || '').toLowerCase();
          if (type.includes('лекц') || type.includes('мк') || type.includes('мастер')) type = 'lecture';
          else if (type.includes('клуб') || type.includes('встреч')) type = 'club';
          else if (!['lecture', 'club', 'other'].includes(type)) type = 'other';

          mObj.events[day].push({
            time: row.time || '19:00',
            title: row.title,
            link: row.link || '',
            price: row.price || 'Уточняйте',
            booking: row.booking || '',
            type: type
          });
        });

        // Формируем список ТОЛЬКО тех месяцев, где есть события, и сортируем хронологически
        const sortedKeys = Array.from(map.keys()).sort();
        monthsData = sortedKeys.map(k => map.get(k));

        if (monthsData.length > 0) {
          const now = new Date();
          const todayDate = now.getDate();
          const currentRealMonthIdx = monthsData.findIndex(m => m.monthIndex === now.getMonth() && m.year === now.getFullYear());

          if (currentRealMonthIdx !== -1) {
            const currentMonthObj = monthsData[currentRealMonthIdx];
            // Проверяем: есть ли в текущем месяце события сегодня или в оставшиеся дни месяца
            const hasUpcomingEventsThisMonth = Object.keys(currentMonthObj.events).some(day => Number(day) > todayDate);

            // Если все события текущего месяца уже прошли, и есть следующий месяц — открываем его
            if (!hasUpcomingEventsThisMonth && currentRealMonthIdx + 1 < monthsData.length) {
              currentMonthIndex = currentRealMonthIdx + 1;
            } else {
              currentMonthIndex = currentRealMonthIdx;
            }
          } else {
            // Если в текущем месяце вообще не было событий — ищем ближайший будущий месяц
            const futureIdx = monthsData.findIndex(m => m.year > now.getFullYear() || (m.year === now.getFullYear() && m.monthIndex >= now.getMonth()));
            currentMonthIndex = futureIdx !== -1 ? futureIdx : 0;
          }
        } else {
          // Если вообще нет событий, показываем текущий пустой месяц
          const now = new Date();
          monthsData = [{
            name: MONTH_NAMES[now.getMonth()],
            year: now.getFullYear(),
            monthIndex: now.getMonth(),
            totalDays: new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(),
            events: {}
          }];
          currentMonthIndex = 0;
        }
      }

      async function loadData() {
        try {
          const cacheBusterUrl = `${GOOGLE_SHEET_CSV_URL}&_t=${Date.now()}`;
          const response = await fetch(cacheBusterUrl);
          if (!response.ok) throw new Error('Ошибка сети при загрузке CSV');
          
          const csvText = await response.text();
          const parsed = parseCSV(csvText);
          processParsedData(parsed);
        } catch (e) {
          console.warn("Данные из Google Таблицы не загрузились:", e);
        } finally {
          el.loadingState.style.display = 'none';
          renderCurrentView();
        }
      }

      // ==================== УТИЛИТЫ ====================
      function formatDate(year, monthIndex, day) {
        const date = new Date(year, monthIndex, day);
        const dayName = WEEKDAYS_SHORT[date.getDay()];
        const monthGen = MONTH_GENITIVE[monthIndex];
        return `${day} ${monthGen}, ${dayName}`;
      }

      function getBookingInfo(ev, year, monthIndex, day) {
        const dateStr = formatDate(year, monthIndex, day);
        const priceStr = ev.price || 'Уточняется';
        const msg = `Здравствуйте! Хочу записаться на мероприятие:\n«${ev.title}»\n📅 Дата: ${dateStr}\n⏰ Время: ${ev.time}\n💰 Стоимость: ${priceStr}`;
        const encodedMsg = encodeURIComponent(msg);

        if (ev.booking) {
          const clean = ev.booking.replace('@', '').trim();
          return { text: `Запись: ${ev.booking}`, url: `https://t.me/${clean}?text=${encodedMsg}` };
        }
        return { text: 'ЗАПИСАТЬСЯ', url: `https://t.me/lena_timinova?text=${encodedMsg}` };
      }

      function getEventTitleHTML(ev) {
        if (ev.link) {
          return `<a href="${ev.link}" target="_blank">${ev.title}</a>`;
        }
        return ev.title;
      }

      function getGoogleCalendarLink(year, monthIndex, day, ev) {
        const monthStr = String(monthIndex + 1).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const [startHour, startMin] = (ev.time || '19:00').split(':').map(Number);
        const startIso = `${year}${monthStr}${dayStr}T${String(startHour).padStart(2,'0')}${String(startMin || 0).padStart(2,'0')}00`;
        const endHour = startHour + 2;
        const endDay = endHour >= 24 ? day + 1 : day;
        const endDayStr = String(endDay).padStart(2, '0');
        const endHourStr = String(endHour % 24).padStart(2, '0');
        const endIso = `${year}${monthStr}${endDayStr}T${endHourStr}${String(startMin || 0).padStart(2,'0')}00`;
        const title = encodeURIComponent(ev.title);
        const details = encodeURIComponent(`Стоимость: ${ev.price}\n\nДосуговый центр «Пятница»`);
        const location = encodeURIComponent('Досуговый центр Пятница, Краснодар');
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startIso}/${endIso}&details=${details}&location=${location}`;
      }

      function matchesSearch(ev) {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (ev.title && ev.title.toLowerCase().includes(q)) || 
               (ev.price && ev.price.toLowerCase().includes(q)) ||
               (ev.booking && ev.booking.toLowerCase().includes(q));
      }

      function updateNavButtons() {
        el.prevBtn.disabled = (currentMonthIndex <= 0);
        el.nextBtn.disabled = (currentMonthIndex >= monthsData.length - 1);
      }

      // ==================== РЕНДЕРИНГ КАЛЕНДАРЯ ====================
      function renderCalendar() {
        const m = monthsData[currentMonthIndex];
        if (!m) return;

        updateNavButtons();

        const realYear = new Date().getFullYear();
        el.monthTitle.textContent = `${m.name}${m.year !== realYear ? ' ' + m.year : ''}`;

        el.calendarGrid.innerHTML = '';

        const firstDayDate = new Date(m.year, m.monthIndex, 1);
        let firstDayOffset = firstDayDate.getDay();
        firstDayOffset = (firstDayOffset === 0) ? 6 : firstDayOffset - 1;

        for (let i = 0; i < firstDayOffset; i++) {
          const empty = document.createElement('div');
          empty.className = 'day-cell other-month';
          el.calendarGrid.appendChild(empty);
        }

        const today = new Date();
        const isCurrentMonth = (today.getMonth() === m.monthIndex && today.getFullYear() === m.year);
        const todayDate = today.getDate();

        for (let day = 1; day <= m.totalDays; day++) {
          const dateObj = new Date(m.year, m.monthIndex, day);
          const dayOfWeek = dateObj.getDay();
          const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
          const isToday = isCurrentMonth && todayDate === day;

          const cell = document.createElement('div');
          cell.className = `day-cell ${isWeekend ? 'weekend' : ''} ${isToday ? 'today' : ''}`;

          const header = document.createElement('div');
          header.className = 'day-header';
          const numSpan = document.createElement('span');
          numSpan.className = 'day-num';
          numSpan.textContent = day;
          header.appendChild(numSpan);
          cell.appendChild(header);

          const rawEvents = (m.events && m.events[day]) || [];
          const events = rawEvents.filter(matchesSearch);

          if (events.length) {
            const list = document.createElement('div');
            list.className = 'events-list';
            events.forEach(ev => {
              const btn = document.createElement('button');
              btn.className = `time-btn type-${ev.type}`;
              btn.textContent = ev.time;
              btn.dataset.day = day;
              list.appendChild(btn);
            });
            cell.appendChild(list);
          }

          el.calendarGrid.appendChild(cell);
        }

        const totalCells = firstDayOffset + m.totalDays;
        const trailing = (7 - (totalCells % 7)) % 7;
        for (let i = 0; i < trailing; i++) {
          const empty = document.createElement('div');
          empty.className = 'day-cell other-month';
          el.calendarGrid.appendChild(empty);
        }
      }

      // ==================== РЕНДЕРИНГ СПИСКА ====================
      function renderList() {
        const m = monthsData[currentMonthIndex];
        if (!m) return;

        updateNavButtons();

        const allEvents = [];
        for (let day = 1; day <= m.totalDays; day++) {
          const dayEvents = (m.events && m.events[day]) || [];
          dayEvents.forEach(ev => {
            if (matchesSearch(ev)) {
              allEvents.push({ day, ...ev });
            }
          });
        }

        if (allEvents.length === 0) {
          const emptyText = searchQuery 
            ? 'По вашему запросу ничего не найдено' 
            : 'В этом месяце пока нет событий';
          el.listContent.innerHTML = `<div class="list-empty">${emptyText}</div>`;
          return;
        }

        const groups = new Map();
        allEvents.forEach(ev => {
          if (!groups.has(ev.day)) groups.set(ev.day, []);
          groups.get(ev.day).push(ev);
        });
        const sortedDays = Array.from(groups.keys()).sort((a, b) => a - b);

        const today = new Date();
        const isCurrentMonth = (today.getMonth() === m.monthIndex && today.getFullYear() === m.year);
        const todayDate = today.getDate();

        let html = '';
        sortedDays.forEach(day => {
          const events = groups.get(day).sort((a, b) => a.time.localeCompare(b.time));
          const dateObj = new Date(m.year, m.monthIndex, day);
          const dayNameShort = WEEKDAYS_SHORT[dateObj.getDay()];
          const isToday = isCurrentMonth && todayDate === day;
          const monthGen = MONTH_GENITIVE[m.monthIndex];

          html += `
            <div class="list-day-group">
              <div class="list-day-header">
                <span class="list-day-number">${day}</span>
                <div class="list-day-info">
                  <span class="list-day-month">${monthGen}, ${dayNameShort}</span>
                  ${isToday ? '<span class="list-today-badge">Сегодня</span>' : ''}
                </div>
              </div>
          `;

          events.forEach(ev => {
            const typeClass = ev.type || 'other';
            const priceText = ev.price || 'Уточняйте';
            const booking = getBookingInfo(ev, m.year, m.monthIndex, day);
            const titleHTML = getEventTitleHTML(ev);
            const gcalLink = getGoogleCalendarLink(m.year, m.monthIndex, day, ev);

            html += `
              <div class="list-event-item">
                <span class="list-event-time">${ev.time}</span>
                <span class="list-event-dot type-${typeClass}"></span>
                <div class="list-event-info">
                  <div class="list-event-title">${titleHTML}</div>
                  <div class="list-event-meta">
                    <span class="list-event-price">${priceText}</span>
                    <span class="list-event-booking"><a href="${booking.url}" target="_blank">${booking.text}</a></span>
                    <a href="${gcalLink}" target="_blank" class="gcal-btn">📅</a>
                  </div>
                </div>
              </div>
            `;
          });

          html += `</div>`;
        });

        el.listContent.innerHTML = html;
      }

      function renderCurrentView() {
        if (currentView === 'calendar') {
          renderCalendar();
        } else {
          renderList();
        }
      }

      // ==================== УПРАВЛЕНИЕ ПОИСКОМ ====================
      window.openSearch = function() {
        el.searchBarContainer.classList.add('active');
        el.searchInput.focus();
      };

      window.closeSearch = function() {
        el.searchBarContainer.classList.remove('active');
        el.searchInput.value = '';
        searchQuery = '';
        renderCurrentView();
      };

      el.searchInput.addEventListener('input', function(e) {
        searchQuery = e.target.value.trim();
        renderCurrentView();
      });

      // ==================== ПЕРЕКЛЮЧЕНИЕ МЕСЯЦЕВ И ВИДОВ ====================
      window.switchMonth = function(direction) {
        const nextIdx = currentMonthIndex + direction;
        if (nextIdx >= 0 && nextIdx < monthsData.length) {
          currentMonthIndex = nextIdx;
          renderCurrentView();
        }
      };

      window.switchView = function(view) {
        currentView = view;
        if (view === 'calendar') {
          el.calendarView.classList.remove('hidden');
          el.calendarView.style.display = 'block';
          el.listView.classList.remove('active');
          el.listView.style.display = 'none';
          el.viewCalendar.classList.add('active');
          el.viewList.classList.remove('active');
          renderCalendar();
        } else {
          el.calendarView.classList.add('hidden');
          el.calendarView.style.display = 'none';
          el.listView.classList.add('active');
          el.listView.style.display = 'flex';
          el.viewList.classList.add('active');
          el.viewCalendar.classList.remove('active');
          renderList();
        }
      };

      // ==================== МОДАЛЬНОЕ ОКНО ====================
      function openModal(day) {
        const m = monthsData[currentMonthIndex];
        if (!m || !m.events || !m.events[day]) return;

        const rawEvents = m.events[day];
        const events = rawEvents.filter(matchesSearch);
        if (!events.length) return;

        const dateStr = formatDate(m.year, m.monthIndex, day);
        el.modalTitle.innerHTML = `<span>✦</span> ${dateStr}`;

        let contentHTML = '';
        events.forEach(ev => {
          const booking = getBookingInfo(ev, m.year, m.monthIndex, day);
          const titleHTML = getEventTitleHTML(ev);
          const gcalLink = getGoogleCalendarLink(m.year, m.monthIndex, day, ev);

          contentHTML += `
            <div class="event-card type-${ev.type}">
              <div class="event-top">
                <span class="event-time-badge">${ev.time}</span>
                <span class="event-cost">${ev.price}</span>
              </div>
              <div class="event-name">${titleHTML}</div>
              <div class="event-action"><a href="${booking.url}" target="_blank">${booking.text}</a>
                <a href="${gcalLink}" target="_blank" class="gcal-btn">📅 Добавить в календарь</a>
              </div>
            </div>
          `;
        });

        el.modalContent.innerHTML = contentHTML;
        el.modalOverlay.classList.add('active');
      }

      // ==================== ОБРАБОТЧИКИ СОБЫТИЙ ====================
      el.calendarGrid.addEventListener('click', function(e) {
        const btn = e.target.closest('.time-btn');
        if (!btn) return;
        const day = parseInt(btn.dataset.day, 10);
        if (!isNaN(day)) openModal(day);
      });

      window.closeModal = function(e) {
        if (e.target === el.modalOverlay) closeModalDirect();
      };
      window.closeModalDirect = function() {
        el.modalOverlay.classList.remove('active');
      };
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeModalDirect();
          if (el.searchBarContainer.classList.contains('active')) {
            closeSearch();
          }
        }
      });

      // ==================== СТАРТ ====================
      loadData();
    })();
  </script>
