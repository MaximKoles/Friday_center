<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Календарь — Досуговый центр «Пятница»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121b24;
      --bg-card: #182330;
      --bg-cell: #1d2c3c;
      --bg-cell-empty: #15202b;
      --border: #293d52;
      --border-light: rgba(229, 184, 59, 0.25);
      
      /* Фирменные цвета категорий */
      --cat-lecture: #e5b83b;       /* Желтый — Лекции и МК */
      --cat-club: #9e3f35;          /* Терракотовый — Клубы и встречи */
      --cat-other: #789242;         /* Зеленый — Игры, шоу, квартирники */

      --cat-lecture-text: #121b24;
      --cat-club-text: #f5eedc;
      --cat-other-text: #f5eedc;

      --text-main: #f5eedc;
      --text-muted: #8da2b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px 32px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(229, 184, 59, 0.12);
      color: var(--cat-lecture);
      border: 1px solid rgba(229, 184, 59, 0.28);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .brand-tag:hover {
      background: rgba(229, 184, 59, 0.2);
    }
    .brand-tag:active {
      transform: scale(0.96);
    }

    .month-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .nav-btn:active {
      transform: scale(0.92);
      background: var(--border);
    }

    .nav-btn.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      text-transform: capitalize;
    }

    /* Памятка по цветам */
    .legend-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 14px;
      padding: 6px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .legend-dot.lecture { background-color: var(--cat-lecture); }
    .legend-dot.club { background-color: var(--cat-club); }
    .legend-dot.other { background-color: var(--cat-other); }

    .calendar-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 8px 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 6px;
      text-align: center;
    }

    .weekday {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0;
      text-transform: uppercase;
    }

    .weekday.weekend {
      color: #e57368;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-cell {
      background-color: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 62px;
      padding: 4px 2px 3px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .day-cell.other-month {
      background-color: var(--bg-cell-empty);
      border-color: rgba(41, 61, 82, 0.35);
      opacity: 0.25;
    }

    .day-header {
      display: flex;
      justify-content: flex-start;
      padding: 0 3px 2px;
    }

    .day-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1;
    }

    .day-cell.weekend .day-num {
      color: #e57368;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-grow: 1;
    }

    .time-btn {
      display: block;
      border: none;
      cursor: pointer;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 1px;
      border-radius: 5px;
      text-align: center;
      line-height: 1.15;
      letter-spacing: -0.02em;
      transition: transform 0.1s ease, filter 0.1s ease;
      width: 100%;
    }

    .time-btn.type-lecture {
      background-color: var(--cat-lecture);
      color: var(--cat-lecture-text);
    }

    .time-btn.type-club {
      background-color: var(--cat-club);
      color: var(--cat-club-text);
    }

    .time-btn.type-other {
      background-color: var(--cat-other);
      color: var(--cat-other-text);
    }

    .time-btn:active {
      transform: scale(0.93);
      filter: brightness(0.9);
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 16, 22, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, visibility 0.18s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      animation: popModal 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    }

    @keyframes popModal {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 14px 16px;
      background: #111a24;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-title span {
      color: var(--cat-lecture);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .close-btn:active {
      color: var(--cat-lecture);
    }

    .modal-body {
      padding: 14px;
      max-height: 65vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-card {
      background: #111b26;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-card.type-lecture { border-left: 3px solid var(--cat-lecture); }
    .event-card.type-club { border-left: 3px solid var(--cat-club); }
    .event-card.type-other { border-left: 3px solid var(--cat-other); }

    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .event-time-badge {
      font-weight: 800;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: -0.01em;
    }

    .event-card.type-lecture .event-time-badge {
      background: var(--cat-lecture);
      color: var(--cat-lecture-text);
    }

    .event-card.type-club .event-time-badge {
      background: var(--cat-club);
      color: var(--cat-club-text);
    }

    .event-card.type-other .event-time-badge {
      background: var(--cat-other);
      color: var(--cat-other-text);
    }

    .event-cost {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--cat-lecture);
    }

    .event-name {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);
    }

    .event-name a {
      color: var(--text-main);
      text-decoration: underline;
      text-decoration-color: rgba(245, 238, 220, 0.4);
    }

    .event-action {
      margin-top: 2px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .event-action a {
      color: var(--cat-lecture);
      text-decoration: none;
      font-weight: 700;
    }

    .footer-bar {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .footer-bar a {
      color: var(--cat-lecture);
      font-weight: 700;
      text-decoration: none;
    }
    .creator-credits {
      margin-top: 30px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim, #5c7287);
    }

    .creator-credits a {
      color: var(--text-muted, #8da2b5);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .creator-credits a:hover,
    .creator-credits a:active {
      color: var(--cat-lecture, #e5b83b);
      text-decoration: underline;
    }
    .gcal-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(141, 162, 181, 0.08);
      border: 1px solid rgba(141, 162, 181, 0.2);
      color: var(--text-muted) !important;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 6px;
      text-decoration: none !important;
      transition: all 0.15s ease;
    }

    .gcal-btn:active {
      background: rgba(141, 162, 181, 0.18);
      color: var(--text-main) !important;
      transform: scale(0.97);
    }
    /* Подсветка текущего дня */
    .day-cell.today {
      border: 1.5px solid var(--cat-lecture);
      background: rgba(229, 184, 59, 0.08);
      box-shadow: 0 0 10px rgba(229, 184, 59, 0.15);
    }

    .day-cell.today .day-num {
      color: var(--cat-lecture);
    }

    .today-tag {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--cat-lecture);
      text-transform: uppercase;
      margin-left: auto;
      letter-spacing: 0.02em;
    }
  </style>
</head>

    const weekDaysNames = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
    let currentMonthIndex = 1; // 0 = Август, 1 = Сентябрь

    function renderCalendar() {
      const monthData = monthsData[currentMonthIndex];
      document.getElementById("monthTitle").textContent = monthData.name;
      
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      
      prevBtn.classList.toggle("disabled", currentMonthIndex === 0);
      nextBtn.classList.toggle("disabled", currentMonthIndex === monthsData.length - 1);

      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      // Пустые ведущие ячейки
      for (let i = 0; i < monthData.firstDayOffset; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day-cell other-month";
        grid.appendChild(emptyCell);
      }

      // Дни месяца
      const today = new Date();
      const currentRealMonth = today.getMonth(); // 7 = Август, 8 = Сентябрь
      const currentRealDate = today.getDate();

      for (let day = 1; day <= monthData.totalDays; day++) {
        const dayOfWeekIndex = (monthData.firstDayOffset + day - 1) % 7;
        const isWeekend = dayOfWeekIndex === 5 || dayOfWeekIndex === 6;
        const dayEvents = monthData.events[day];
        
        // Проверка на текущий день (Август = индекс 0, Сентябрь = индекс 1)
        const targetMonthNum = currentMonthIndex === 0 ? 7 : 8;
        const isToday = currentRealMonth === targetMonthNum && currentRealDate === day;

        const cell = document.createElement("div");
        cell.className = `day-cell ${isWeekend ? "weekend" : ""} ${isToday ? "today" : ""}`;

        let buttonsHtml = "";
        if (dayEvents && dayEvents.length > 0) {
          buttonsHtml = '<div class="events-list">' +
            dayEvents.map((ev, idx) => `
              <button class="time-btn type-${ev.type}" onclick="openModal(${currentMonthIndex}, ${day})">${ev.time}</button>
            `).join("") +
            '</div>';
        }

        cell.innerHTML = `
          <div class="day-header">
            <span class="day-num">${day}</span>
          </div>
          ${buttonsHtml}
        `;

        grid.appendChild(cell);
      }

      // Хвостовые ячейки
      const trailing = (7 - ((monthData.firstDayOffset + monthData.totalDays) % 7)) % 7;
      for (let i = 0; i < trailing; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day-cell other-month";
        grid.appendChild(emptyCell);
      }
    }

    function switchMonth(direction) {
      const newIndex = currentMonthIndex + direction;
      if (newIndex >= 0 && newIndex < monthsData.length) {
        currentMonthIndex = newIndex;
        renderCalendar();
      }
    }

    // Функция для правильного склонения месяца в родительном падеже
    function getMonthInGenitive(monthName) {
      const map = {
        "Январь": "января",
        "Февраль": "февраля",
        "Март": "марта",
        "Апрель": "апреля",
        "Май": "мая",
        "Июнь": "июня",
        "Июль": "июля",
        "Август": "августа",
        "Сентябрь": "сентября",
        "Октябрь": "октября",
        "Ноябрь": "ноября",
        "Декабрь": "декабря"
      };
      return map[monthName] || monthName;
    }

    function createGoogleCalendarLink(mIndex, day, ev) {
      const month = mIndex === 0 ? "08" : "09"; // 08 = Август, 09 = Сентябрь
      const dayStr = String(day).padStart(2, "0");
      
      const [startHour, startMin] = ev.time.split(":").map(Number);
      const startIso = `2026${month}${dayStr}T${String(startHour).padStart(2, "0")}${String(startMin).padStart(2, "0")}00`;
      
      // Длительность 2 часа
      const endHour = startHour + 2;
      const endDay = endHour >= 24 ? String(day + 1).padStart(2, "0") : dayStr;
      const endHourStr = String(endHour % 24).padStart(2, "0");
      const endIso = `2026${month}${endDay}T${endHourStr}${String(startMin).padStart(2, "0")}00`;

      const title = encodeURIComponent(ev.title);
      const details = encodeURIComponent(`Стоимость: ${ev.price}\n\nДосуговый центр «Пятница»`);
      const location = encodeURIComponent("Досуговый центр Пятница, Краснодар");

      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startIso}/${endIso}&details=${details}&location=${location}`;
    }

    function openModal(mIndex, day) {
      const monthData = monthsData[mIndex];
      const events = monthData.events[day];
      const modal = document.getElementById("modalOverlay");
      const title = document.getElementById("modalTitle");
      const content = document.getElementById("modalContent");

      const monthNum = mIndex === 0 ? 7 : 8;
      const dateObj = new Date(2026, monthNum, day);
      const dayName = weekDaysNames[dateObj.getDay()];

      title.innerHTML = `<span>✦</span> ${day} ${monthData.name.toLowerCase()}, ${dayName}`;

      content.innerHTML = events.map(ev => {
        let bookingHtml = "";
        if (ev.booking) {
          const cleanUser = ev.booking.replace('@', '');
          bookingHtml = `<div class="event-action">Запись: <a href="https://t.me/${cleanUser}" target="_blank">${ev.booking}</a></div>`;
        } else {
          bookingHtml = `<div class="event-action">Запись через <a href="https://t.me/lena_timinova" target="_blank">@lena_timinova</a></div>`;
        }

        // Обработка названия с ссылками
        let titleHtml = ev.title;
        if (ev.link) {
          titleHtml = `<a href="${ev.link}" target="_blank">${ev.title}</a>`;
        } else if (ev.links && ev.links.length > 0) {
          // Если несколько ссылок (как у 27 сентября)
          let linkHtml = ev.title;
          // Добавляем ссылки на проекты в название
          const projects = ev.links.map(l => `<a href="${l}" target="_blank">${l.replace('https://t.me/', '@')}</a>`).join(' & ');
          linkHtml = ev.title.replace('«Популярная история»', `«Популярная история» (${projects.split(' & ')[0]})`)
                            .replace('«Свидание с Краснодаром»', `«Свидание с Краснодаром» (${projects.split(' & ')[1]})`);
          titleHtml = linkHtml;
        }

        const gCalLink = createGoogleCalendarLink(mIndex, day, ev);

        return `
          <div class="event-card type-${ev.type}">
            <div class="event-top">
              <span class="event-time-badge">${ev.time}</span>
              <span class="event-cost">${ev.price}</span>
            </div>
            <div class="event-name">${titleHtml}</div>
            ${bookingHtml}
            <div class="event-action" style="margin-top: 6px;">
              <a href="${gCalLink}" target="_blank" class="gcal-btn">📅 Добавить в календарь</a>
            </div>
          </div>
        `;
      }).join("");

      modal.classList.add("active");
    }

    function closeModalDirect() {
      document.getElementById("modalOverlay").classList.remove("active");
    }

    function closeModal(event) {
      if (event.target === document.getElementById("modalOverlay")) {
        closeModalDirect();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModalDirect();
    });

    // Стартовая отрисовка
    renderCalendar();
  </script>
